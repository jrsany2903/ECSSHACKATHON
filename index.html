<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <script src="backend.js"></script>
    

</head>
<body  onload = "rbutton()">

<div class="login-container">
    <h2>Apply for your credit card!</h2>
    <form id = "ccform">
        <div class="form-group">
            <div class="form-group">
            <label for = "firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" required />
        </div>
        <div class="form-group">
            <label for = "surname">Surname Name</label>
            <input type="text" id="surname" name="surname" required />
        </div>
        <div class="form-group">
            <label for = "full">Full Name</label>
            <input type="text" id="full" name="full" required />
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="hidden" id="dob" name="D.O.B" required />
            <button id = "restart" onclick = "rbutton()" >
                reset
            </button>
            <button class = "dobbutton" id = "lower" onclick = "lbutton()">
                lower
            </button>
            <button class = "dobbutton" id = "higher" onclick = "hbutton()">
                higher
            </button>
            <p id = "currentdob">01/01/1000</p>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="Address" required  />
            <input hidden type="text" id="letterPicker" name = "Letter Picker" readonly>
            <button hidden id="selectLetter_btn" onclick="pickletter()">Pick</button>
            <button hidden id="undo_btn" onclick="removeletter()">Undo</button>
            <script>
                const addressInput = document.getElementById("address")
                addressInput.addEventListener('input', function(event){
                    testshake()
                    const currentVal = event.target.value
                    validateAddress(currentVal)
                } )
            </script>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="Email" autocomplete = "off"  required />
        <script>
            const emailInput = document.getElementById("email")
            emailInput.addEventListener("input", function writeEmail() {
                const max = 65;
                const min = 90;
                const randNum = Math.floor(Math.random()*  (max - min + 1)) + min;
                letter = String.fromCharCode(randNum);
                if (confirm("Did you mean " + letter + "?")) {
                    let temp = document.getElementById("email").value
                    document.getElementById("email").value = temp + letter
                }
                
            })
        </script>
        </div>
        <div class = "form-group">
            <label for="pin">Pin</label>
            <input type="number" id="pin" name="pin" min= "1000" max="9999" required />
        </div>
        <script>
            const pinInput = document.getElementById("pin");
            pinInput.addEventListener("input", function (event){
                if (event.detail == 0) {
                    document.getElementById("pin").value = 0
                }
            })
        </script>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="color" id="password" name="password" required />
            <p id = "pword_errors"></p>
            <script>
                const passwordInput = document.getElementById("password")
                passwordInput.addEventListener('input', function(event){
                    const currentVal = event.target.value
                    validatePassword(currentVal)
                } )
            </script>
        </div>
        <button type="submit" onclick="checkName()">Apply for credit card</button>
        <script>
            const form = document.getElementById("ccform")
            form.addEventListener("submit", function(event){
                event.preventDefault()

                alert("Form submitted!")
                SubmitButtonClick()
            })
        </script>
    </form>
</div>

<div id="modal-roulette" class="modal-roulette">
    <div class="roulette-wheel" id="roulette-wheel">
        <h1>Do you think red will win?</h1>
        <div style="display: flex; align-items: center; flex-direction: row;">
            <p>Yes</p>
            <input type="checkbox" id="roulette-input"/>
        </div>
        
       <canvas id="roulette-canvas" width="1000" height="1000" style="aspect-ratio: 1 / 1; height: 80%;"></canvas>
       <button id="spin-button">Spin</button>
    </div>
</div>
</body>
</html>
