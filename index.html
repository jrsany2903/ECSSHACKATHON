<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <script src="backend.js"></script>
    

</head>
<body  onload = "rbutton()">

<div class="login-container">
    <h2>Apply for your credit card!</h2>
    <form id = "ccform">
        <div class="form-group">
            <div class="form-group">
            <label for = "firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" required />
        </div>
        <div class="form-group">
            <label for = "surname">Surname Name</label>
            <input type="text" id="surname" name="surname" required />
        </div>
        <div class="form-group">
            <label for = "full">Full Name</label>
            <input type="text" id="full" name="full" onclick = "checkName()" required />
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="hidden" id="dob" name="D.O.B" required />
            <button id = "restart" onclick = "rbutton()" >
                reset
            </button>
            <button class = "dobbutton" id = "lower" onclick = "lbutton()">
                lower
            </button>
            <button class = "dobbutton" id = "higher" onclick = "hbutton()">
                higher
            </button>
            <p id = "currentdob">01/01/1000</p>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="Address" required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="Email" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="color" id="password" name="password" required />
            <p id = "pword_errors"></p>
            <script>
                const passwordInput = document.getElementById("password")
                passwordInput.addEventListener('input', function(event){
                    const currentVal = event.target.value
                    validatePassword(currentVal)
                } )
            </script>
        </div>
        <button type="submit">Apply for credit card</button>
        <script>
            const form = document.getElementById("ccform")
            form.addEventListener("submit", function(event){
                event.preventDefault()
                formData = new FormData(event.target)
                Savetofile(formData)

                alert("your info has been stored on a server in arabic")
            })
        </script>
    </form>
</div>

</body>
</html>
