<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <script src="backend.js"></script>
    

</head>
<body>

<div class="login-container">
    <h2>Apply for your credit card!</h2>
    <form action="/login" method="post">
        <div class="form-group">
            <div class="form-group">
            <label for = "firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" required />
        </div>
        <div class="form-group">
            <label for = "surname">Surname Name</label>
            <input type="text" id="surname" name="surname" required />
        </div>
        <div class="form-group">
            <label for = "full">Full Name</label>
            <input type="text" id="full" name="full" required />
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="text" id="dob" name="D.O.B" required />
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="Address" required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="Email" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <p id = "pword_errors"></p>
            <script>
                const passwordInput = document.getElementById("password")
                passwordInput.addEventListener('input', function(event){
                    const currentVal = event.target.value
                    validatePassword(currentVal)
                } )
            </script>
        </div>
        <button type="submit">Apply for credit card</button>
    </form>
</div>

</body>
</html>
